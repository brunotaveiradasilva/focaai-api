server:
  port: ${PORT:8080}

spring:
  application:
    name: focaai-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/focaai}
    username: ${DB_USERNAME:focaai}
    password: ${DB_PASSWORD:focaai}

  jpa:
    open-in-view: false
    # O schema é do Flyway (src/main/resources/db/migration); o Hibernate só confere.
    hibernate:
      ddl-auto: validate
    show-sql: false

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # Origens que podem chamar a API pelo navegador (versão web do app), separadas por vírgula.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}

  auth:
    # Assina os tokens de acesso da API (mín. 32 caracteres). O padrão só serve para rodar local.
    jwt-secret: ${JWT_SECRET:dev-chave-so-para-rodar-local-troque-antes-de-publicar}
    acesso-minutos: ${JWT_ACESSO_MINUTOS:60}
    renovacao-dias: ${JWT_RENOVACAO_DIAS:60}
    google:
      # Client IDs OAuth do app no Google Cloud (web, Android e iOS), separados por vírgula.
      client-ids: ${GOOGLE_CLIENT_IDS:}

  # Códigos de cadastro e de "esqueci minha senha", mandados pelo Resend (resend.com).
  email:
    resend-url: ${RESEND_API_URL:https://api.resend.com}
    # Sem chave, entrar com e-mail fica fora (só Google).
    resend-api-key: ${RESEND_API_KEY:}
    # onboarding@resend.dev só entrega para o e-mail da conta do Resend; para todos, use um domínio verificado lá.
    remetente: ${EMAIL_REMETENTE:FocaAI <onboarding@resend.dev>}

  enem:
    url: ${ENEM_API_URL:https://api.enem.dev/v1}
    # Baixa em segundo plano, ao subir, as provas que ainda não estão no banco.
    aquecer-cache: ${ENEM_AQUECER_CACHE:true}
