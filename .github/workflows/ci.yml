name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify

  # O Railway builda a partir do Dockerfile: confere aqui que a imagem sai.
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # O Docker Hub limita downloads anônimos vindos dos runners do GitHub (429); o espelho do Google não.
      - name: Usar espelho do Docker Hub
        run: |
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - run: docker build -t focaai-api .
